<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Polaroid Camera</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 20% 0%,#432333 0%,transparent 35%),
    radial-gradient(circle at 100% 100%,#301622 0%,transparent 40%),
    #100d12;
  color:#fff;
  font-family:Arial,sans-serif;
}

button{
  border:0;
  font-family:inherit;
  cursor:pointer;
  touch-action:manipulation;
}

.app{
  width:100%;
  max-width:520px;
  margin:auto;
  padding:14px 14px 35px;
}

.header{
  text-align:center;
  padding:6px 0 15px;
}

.logo{
  width:52px;
  height:52px;
  margin:auto;
  border-radius:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:27px;
  background:linear-gradient(145deg,#ff8db7,#ff3f85);
  box-shadow:0 8px 25px #ff4f9140;
}

h1{
  font-size:22px;
  margin:8px 0 3px;
}

.subtitle{
  color:#aaa;
  font-size:12px;
}

/* CAMERA */

.camera-wrap{
  padding:6px;
  border-radius:27px;
  background:linear-gradient(145deg,#ffffff18,#ffffff05);
  box-shadow:0 18px 45px #0009;
}

.camera{
  position:relative;
  width:100%;
  aspect-ratio:3/4;
  background:#050505;
  border-radius:21px;
  overflow:hidden;
  transition:aspect-ratio .25s ease;
}

video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;

  /*
   * Preview kamera depan dibuat MIRROR
   * seperti kamera selfie HP.
   *
   * Hasil foto TIDAK mirror.
   */
  transform:none;
}

video.selfie{
  transform:scaleX(-1);
}

/* FILTER */

.filter-layer{
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:2;
  opacity:1;
  mix-blend-mode:normal;
  transition:.15s;
}

.camera-ui{
  position:absolute;
  inset:0;
  padding:12px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  pointer-events:none;
  z-index:4;
}

.camera-top{
  display:flex;
  justify-content:space-between;
  gap:8px;
  pointer-events:auto;
}

.glass-btn{
  padding:10px 13px;
  border-radius:14px;
  color:#fff;
  background:#0008;
  border:1px solid #ffffff25;
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  font-size:12px;
  font-weight:bold;
}

.glass-btn:active{
  transform:scale(.95);
}

.camera-bottom{
  display:flex;
  justify-content:center;
  align-items:center;
  pointer-events:auto;
}

.shutter-wrap{
  width:88px;
  height:88px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:#0005;
  backdrop-filter:blur(8px);
}

.shutter{
  width:70px;
  height:70px;
  padding:0;
  border-radius:50%;
  background:#fff;
  border:5px solid #ffffffaa;
  box-shadow:0 0 0 2px #ffffff55,0 5px 18px #0008;
}

.shutter:after{
  content:"";
  display:block;
  width:52px;
  height:52px;
  margin:auto;
  border-radius:50%;
  background:linear-gradient(145deg,#ff8eb8,#ff4388);
}

.shutter:active{
  transform:scale(.9);
}

/* PANEL */

.control-panel,
.frame-panel{
  margin-top:12px;
  padding:14px;
  border-radius:21px;
  background:linear-gradient(145deg,#211c24,#18141b);
  border:1px solid #ffffff0c;
  box-shadow:0 12px 35px #0006;
}

.control-title,
.frame-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:13px;
}

.control-title span{
  color:#ff82ad;
  font-size:11px;
  font-weight:bold;
}

/* RATIO */

.ratios{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:6px;
  margin-top:10px;
}

.ratio{
  padding:9px 3px;
  border-radius:11px;
  background:#302a34;
  color:#bbb;
  font-size:10px;
  font-weight:bold;
}

.ratio.active{
  color:#fff;
  background:linear-gradient(145deg,#ff6da4,#ff3f84);
}

/* FILTERS */

.filter-title{
  margin-top:15px;
  font-size:13px;
  font-weight:bold;
}

.filters{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding:10px 1px 5px;
  scrollbar-width:none;
}

.filters::-webkit-scrollbar{
  display:none;
}

.filter{
  flex:0 0 auto;
  width:62px;
  padding:5px 4px 7px;
  border-radius:12px;
  background:#302a34;
  color:#bbb;
  font-size:9px;
  font-weight:bold;
}

.filter.active{
  background:linear-gradient(145deg,#ff6da4,#ff3f84);
  color:#fff;
}

.filter-thumb{
  width:52px;
  height:52px;
  margin:auto auto 5px;
  border-radius:9px;
  background:
    linear-gradient(135deg,#f6b58b,#d26b98,#6558b7);
}

.filter-name{
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* FRAME */

.frame-number{
  padding:5px 9px;
  border-radius:10px;
  background:#ff4f9120;
  color:#ff8ab5;
  border:1px solid #ff4f9130;
  font-size:11px;
  font-weight:bold;
}

.layouts{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:10px;
}

.layout{
  padding:11px 5px;
  border-radius:13px;
  background:#302a34;
  color:#bbb;
  font-size:11px;
  font-weight:bold;
}

.layout.active{
  background:linear-gradient(145deg,#ff6da4,#ff3f84);
  color:#fff;
}

.helper{
  text-align:center;
  color:#777;
  font-size:10px;
  margin-top:9px;
}

/* POLAROID */

.polaroid{
  margin-top:15px;
  padding:17px 13px 20px;
  border-radius:22px;
  background:linear-gradient(145deg,#fff,#f3eef0);
  color:#171317;
  box-shadow:0 18px 40px #0008;
}

.paper-top{
  text-align:center;
  margin-bottom:14px;
}

.paper-logo{
  font-size:19px;
  color:#ff4f91;
}

.paper-title{
  font-family:Georgia,serif;
  font-size:18px;
  letter-spacing:3px;
  margin-top:4px;
}

.paper-subtitle{
  font-size:9px;
  color:#aaa;
  letter-spacing:1px;
  margin-top:3px;
}

.frame{
  background:#fff;
  margin:10px auto;
  padding:8px 8px 11px;
  max-width:380px;
  border-radius:3px;
  box-shadow:0 5px 14px #0001;
  cursor:pointer;
}

.frame.selected{
  outline:3px solid #ff4f91;
}

.frame h3{
  margin:0 0 7px;
  font-size:9px;
  color:#999;
  text-align:center;
  letter-spacing:1px;
}

.grid{
  display:grid;
  gap:5px;
}

.g1{
  grid-template-columns:1fr;
}

.g2{
  grid-template-columns:1fr 1fr;
}

.g3{
  grid-template-columns:repeat(3,1fr);
}

.slot{
  background:#eee;
  aspect-ratio:1/1;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#aaa;
  font-size:9px;
}

.frame.layout1 .slot{
  aspect-ratio:4/3;
}

.slot img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.paper-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:15px;
}

.paper-actions button{
  padding:12px;
  border-radius:13px;
  background:#19151a;
  color:#fff;
  font-size:11px;
  font-weight:bold;
}

.status{
  text-align:center;
  font-size:10px;
  color:#999;
  margin-top:10px;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:#000b;
  backdrop-filter:blur(7px);
  z-index:20;
}

.modal.show{
  display:flex;
}

.box{
  width:min(380px,100%);
  padding:19px;
  border-radius:25px;
  background:#fff;
  color:#171317;
  text-align:center;
  box-shadow:0 20px 60px #000b;
}

.box-icon{
  width:45px;
  height:45px;
  margin:auto;
  border-radius:15px;
  background:#ffe2ec;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
}

.box h2{
  font-size:18px;
  margin:8px 0;
}

.preview{
  width:100%;
  aspect-ratio:3/4;
  object-fit:cover;
  border-radius:15px;
  margin:4px 0 12px;
  background:#111;
}

.modal-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.modal-actions button{
  padding:13px;
  border-radius:13px;
  font-weight:bold;
}

.no{
  background:#eee;
  color:#444;
}

.yes{
  background:linear-gradient(145deg,#ff6da4,#ff3f84);
  color:#fff;
}

.notice{
  font-size:9px;
  color:#999;
  margin-top:9px;
  line-height:1.4;
}

@media(max-width:370px){

  .ratios{
    grid-template-columns:repeat(3,1fr);
  }

}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="logo">📸</div>
    <h1>Polaroid Camera</h1>
    <div class="subtitle">capture little moments ✦</div>
  </div>


  <div class="camera-wrap">

    <div class="camera" id="camera">

      <video
        id="video"
        autoplay
        playsinline
        muted>
      </video>

      <div
        id="filterLayer"
        class="filter-layer">
      </div>

      <div class="camera-ui">

        <div class="camera-top">

          <button
            class="glass-btn"
            id="flip">
            🔄 Kamera
          </button>

          <button
            class="glass-btn"
            id="clear">
            🗑️ Reset
          </button>

        </div>

        <div class="camera-bottom">

          <div class="shutter-wrap">

            <button
              class="shutter"
              id="capture"
              aria-label="Ambil foto">
            </button>

          </div>

        </div>

      </div>

    </div>

  </div>


  <!-- RATIO -->

  <div class="control-panel">

    <div class="control-title">
      <b>📐 Rasio Foto</b>
      <span id="ratioText">3:4</span>
    </div>

    <div class="ratios">

      <button class="ratio active" data-ratio="3:4">
        3:4
      </button>

      <button class="ratio" data-ratio="9:16">
        9:16
      </button>

      <button class="ratio" data-ratio="16:9">
        16:9
      </button>

      <button class="ratio" data-ratio="2:3">
        2:3
      </button>

      <button class="ratio" data-ratio="4:3">
        4:3
      </button>

      <button class="ratio" data-ratio="1:1">
        1:1
      </button>

    </div>


    <!-- FILTER -->

    <div class="filter-title">
      ✨ Efek Kamera
    </div>

    <div class="filters" id="filters"></div>

  </div>


  <!-- FRAME -->

  <div class="frame-panel">

    <div class="frame-header">

      <b>🎞️ Layout Polaroid</b>

      <div class="frame-number">
        FRAME <span id="frameText">1</span>/5
      </div>

    </div>


    <div class="layouts">

      <button class="layout active" data-layout="1">
        1️⃣ 1 Foto
      </button>

      <button class="layout" data-layout="2">
        2️⃣ 2 Foto
      </button>

      <button class="layout" data-layout="3">
        3️⃣ 3 Foto
      </button>

    </div>

    <div class="helper">
      Setiap frame bisa memakai tata letak berbeda ✦
    </div>

  </div>


  <!-- POLAROID -->

  <div class="polaroid">

    <div class="paper-top">

      <div class="paper-logo">♡</div>

      <div class="paper-title">
        MY POLAROID
      </div>

      <div class="paper-subtitle">
        LITTLE MOMENTS • BIG MEMORIES
      </div>

    </div>

    <div id="frames"></div>

    <div class="paper-actions">

      <button id="downloadPolaroid">
        ⬇️ Download
      </button>

      <button id="printPolaroid">
        🖨️ Cetak
      </button>

    </div>

    <div id="status" class="status">
      Siap mengambil foto ✦
    </div>

  </div>

</div>


<!-- MODAL -->

<div class="modal" id="modal">

  <div class="box">

    <div class="box-icon">
      📸
    </div>

    <h2>
      Simpan ke Polaroid?
    </h2>

    <img
      id="preview"
      class="preview">

    <div class="modal-actions">

      <button
        class="no"
        id="no">
        Tidak
      </button>

      <button
        class="yes"
        id="yes">
        Iya, Simpan
      </button>

    </div>

    <div class="notice">
      Foto akan dimasukkan ke Polaroid
      dan dikirim ke Telegram.
    </div>

  </div>

</div>


<script>

/* =========================================================
   TELEGRAM WORKER
   JANGAN DIUBAH
========================================================= */

const TELEGRAM_SERVER =
  "https://dark-shadow-348epolaroid-telegram.hanifasayank007.workers.dev";


/* =========================================================
   ELEMENT
========================================================= */

const video =
  document.getElementById("video");

const camera =
  document.getElementById("camera");

const filterLayer =
  document.getElementById("filterLayer");

const canvas =
  document.createElement("canvas");

const modal =
  document.getElementById("modal");

const preview =
  document.getElementById("preview");

const framesEl =
  document.getElementById("frames");

const statusEl =
  document.getElementById("status");

const ratioText =
  document.getElementById("ratioText");

const filtersEl =
  document.getElementById("filters");


/* =========================================================
   STATE
========================================================= */

let facing="user";

let pending=null;

let activeFrame=0;

let selectedRatio="3:4";

let selectedFilter="normal";


/* =========================================================
   RATIO
========================================================= */

const ratios={
  "3:4":[3,4],
  "9:16":[9,16],
  "16:9":[16,9],
  "2:3":[2,3],
  "4:3":[4,3],
  "1:1":[1,1]
};


/* =========================================================
   FILTER / EFEK
========================================================= */

/*
  Efek dibuat menggunakan CSS filter.
  Preview dan hasil foto menggunakan efek
  yang sama.
*/

const filters={

  normal:{
    name:"Normal",
    css:"none"
  },

  bright:{
    name:"Bright",
    css:"brightness(1.15) contrast(1.05)"
  },

  vivid:{
    name:"Vivid",
    css:"saturate(1.55) contrast(1.08)"
  },

  warm:{
    name:"Warm",
    css:"sepia(.16) saturate(1.25) contrast(1.04) brightness(1.04)"
  },

  cool:{
    name:"Cool",
    css:"hue-rotate(12deg) saturate(.95) brightness(1.04)"
  },

  cinema:{
    name:"Cinema",
    css:"contrast(1.22) saturate(.88) brightness(.94)"
  },

  vintage:{
    name:"Vintage",
    css:"sepia(.38) saturate(.82) contrast(1.05) brightness(1.03)"
  },

  fade:{
    name:"Fade",
    css:"contrast(.86) brightness(1.12) saturate(.78)"
  },

  bw:{
    name:"B&W",
    css:"grayscale(1) contrast(1.12)"
  },

  sepia:{
    name:"Sepia",
    css:"sepia(.85) contrast(1.04)"
  },

  rose:{
    name:"Rose",
    css:"sepia(.12) hue-rotate(315deg) saturate(1.35) contrast(1.03)"
  },

  dream:{
    name:"Dream",
    css:"brightness(1.12) saturate(.78) contrast(.88) blur(.15px)"
  },

  night:{
    name:"Night",
    css:"brightness(.72) contrast(1.18) saturate(1.18) hue-rotate(7deg)"
  },

  sunset:{
    name:"Sunset",
    css:"sepia(.24) saturate(1.65) contrast(1.06) hue-rotate(-8deg)"
  },

  dramatic:{
    name:"Dramatic",
    css:"contrast(1.42) saturate(1.15) brightness(.91)"
  },

  soft:{
    name:"Soft",
    css:"brightness(1.08) contrast(.88) saturate(.92)"
  },

  pop:{
    name:"Pop",
    css:"saturate(1.85) contrast(1.16) brightness(1.02)"
  },

  moody:{
    name:"Moody",
    css:"brightness(.84) contrast(1.3) saturate(.82)"
  },

  ice:{
    name:"Ice",
    css:"hue-rotate(18deg) saturate(.82) brightness(1.08) contrast(1.08)"
  },

  cocoa:{
    name:"Cocoa",
    css:"sepia(.35) saturate(.92) brightness(.95) contrast(1.08)"
  },

  film:{
    name:"Film",
    css:"sepia(.13) contrast(1.13) saturate(.88) brightness(.98)"
  },

  glow:{
    name:"Glow",
    css:"brightness(1.16) saturate(1.12) contrast(.91)"
  }

};


/* =========================================================
   FILTER THUMBNAIL
========================================================= */

function buatFilterUI(){

  filtersEl.innerHTML="";

  Object.entries(filters)
  .forEach(([id,data])=>{

    const button=
      document.createElement("button");

    button.className=
      "filter"+
      (
        id===selectedFilter
        ?" active"
        :""
      );

    button.dataset.filter=id;


    const thumb=
      document.createElement("div");

    thumb.className=
      "filter-thumb";


    thumb.style.filter=
      data.css;


    const name=
      document.createElement("div");

    name.className=
      "filter-name";

    name.textContent=
      data.name;


    button.appendChild(thumb);

    button.appendChild(name);


    button.onclick=()=>{

      selectedFilter=id;

      filterLayer.style.filter=
        filters[id].css;

      document
      .querySelectorAll(".filter")
      .forEach(el=>{

        el.classList.toggle(
          "active",
          el.dataset.filter===id
        );

      });

      statusEl.textContent=
        `Efek ${filters[id].name} dipilih ✦`;

    };


    filtersEl.appendChild(button);

  });

}


/* =========================================================
   RATIO UPDATE
========================================================= */

function getRatio(){

  const r=
    ratios[selectedRatio];

  return r[0]/r[1];

}


function updateCameraRatio(){

  const r=
    ratios[selectedRatio];

  camera.style.aspectRatio=
    `${r[0]}/${r[1]}`;

  preview.style.aspectRatio=
    `${r[0]}/${r[1]}`;

  ratioText.textContent=
    selectedRatio;

}


/* =========================================================
   CAMERA
========================================================= */

async function startCamera(){

  try{

    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){

      throw new Error(
        "Browser tidak mendukung kamera."
      );

    }


    if(video.srcObject){

      video.srcObject
      .getTracks()
      .forEach(track=>{
        track.stop();
      });

    }


    let stream;


    try{

      stream=
        await navigator.mediaDevices.getUserMedia({

          video:{
            facingMode:{
              exact:facing
            },

            width:{
              ideal:1920
            },

            height:{
              ideal:1080
            }
          },

          audio:false

        });

    }catch(e){

      /*
        Fallback untuk browser tertentu.
      */

      stream=
        await navigator.mediaDevices.getUserMedia({

          video:{
            facingMode:facing,

            width:{
              ideal:1920
            },

            height:{
              ideal:1080
            }
          },

          audio:false

        });

    }


    video.srcObject=
      stream;


    await video.play();


    /*
      INI BAGIAN PENTING:

      Kamera depan:
      preview mirror seperti kamera HP.

      Kamera belakang:
      preview normal.
    */

    if(facing==="user"){

      video.classList.add(
        "selfie"
      );

    }else{

      video.classList.remove(
        "selfie"
      );

    }


    statusEl.textContent=
      facing==="user"
      ?"Kamera selfie siap ✦"
      :"Kamera belakang siap ✦";


  }catch(error){

    console.error(error);

    alert(
      "Kamera tidak bisa dibuka.\n\n"+
      "Izinkan akses kamera dan gunakan HTTPS."
    );

  }

}


/* =========================================================
   RATIO BUTTON
========================================================= */

document
.querySelectorAll(".ratio")
.forEach(button=>{

  button.onclick=()=>{

    selectedRatio=
      button.dataset.ratio;


    document
    .querySelectorAll(".ratio")
    .forEach(btn=>{

      btn.classList.toggle(
        "active",
        btn.dataset.ratio===
        selectedRatio
      );

    });


    updateCameraRatio();

  };

});


/* =========================================================
   FRAME DATA
========================================================= */

const frames=
  Array.from(
    {length:5},
    ()=>({
      layout:1,
      photos:[]
    })
  );


/* =========================================================
   RENDER FRAME
========================================================= */

function render(){

  document
  .getElementById("frameText")
  .textContent=
    activeFrame+1;


  document
  .querySelectorAll(".layout")
  .forEach(btn=>{

    btn.classList.toggle(
      "active",
      Number(btn.dataset.layout)===
      frames[activeFrame].layout
    );

  });


  framesEl.innerHTML="";


  frames.forEach((f,i)=>{

    const frame=
      document.createElement("div");


    frame.className=
      "frame layout"+
      f.layout+
      (
        i===activeFrame
        ?" selected"
        :""
      );


    const title=
      document.createElement("h3");


    title.textContent=
      `FRAME ${i+1} • ${f.layout} FOTO`;


    frame.appendChild(title);


    const grid=
      document.createElement("div");


    grid.className=
      "grid "+
      (
        f.layout===1
        ?"g1"
        :
        f.layout===2
        ?"g2"
        :"g3"
      );


    for(
      let s=0;
      s<f.layout;
      s++
    ){

      const slot=
        document.createElement("div");


      slot.className=
        "slot";


      if(f.photos[s]){

        const img=
          document.createElement("img");


        img.src=
          f.photos[s];


        slot.appendChild(img);

      }else{

        slot.textContent=
          "Kosong";

      }


      grid.appendChild(slot);

    }


    frame.appendChild(grid);


    frame.onclick=()=>{

      activeFrame=i;

      render();

    };


    framesEl.appendChild(frame);

  });

}

function applyFilterToCanvas(ctx){

  const css=
    filters[selectedFilter].css;


  if(css==="none"){

    ctx.filter=
      "none";

  }else{

    ctx.filter=
      css;

  }

}


/* =========================================================
   CAPTURE
========================================================= */

document
.getElementById("capture")
.onclick=()=>{

  if(!video.videoWidth){

    alert(
      "Kamera belum siap."
    );

    return;

  }


  const vw=
    video.videoWidth;

  const vh=
    video.videoHeight;


  const targetRatio=
    getRatio();


  let cropW=vw;

  let cropH=
    vw/targetRatio;


  if(cropH>vh){

    cropH=vh;

    cropW=
      vh*targetRatio;

  }


  const sx=
    (vw-cropW)/2;

  const sy=
    (vh-cropH)/2;


  let outputW=
    Math.round(
      Math.min(
        cropW,
        1920
      )
    );


  let outputH=
    Math.round(
      outputW/targetRatio
    );


  if(outputH>1920){

    outputH=1920;

    outputW=
      Math.round(
        outputH*targetRatio
      );

  }


  canvas.width=
    outputW;

  canvas.height=
    outputH;


  const ctx=
    canvas.getContext("2d");


  /*
    HASIL FOTO TIDAK MIRROR.

    Walaupun preview selfie mirror,
    sumber video asli digambar normal
    ke canvas.
  */

  ctx.save();


  applyFilterToCanvas(ctx);


  ctx.drawImage(
    video,
    sx,
    sy,
    cropW,
    cropH,
    0,
    0,
    outputW,
    outputH
  );


  ctx.restore();


  ctx.filter="none";


  pending=
    canvas.toDataURL(
      "image/jpeg",
      .94
    );


  preview.src=
    pending;


  modal.classList.add(
    "show"
  );

};

/* =========================================================
   TELEGRAM
========================================================= */

async function kirimKeTelegram(dataURL){

  if(
    TELEGRAM_SERVER.includes(
      "GANTI-DENGAN-URL-WORKER"
    )
  ){

    statusEl.textContent=
      "Foto masuk Polaroid. Telegram belum dipasang.";

    return;

  }


  try{

    statusEl.textContent=
      "Mengirim foto ke Telegram...";


    const blob=
      await fetch(dataURL)
      .then(r=>r.blob());


    const form=
      new FormData();


    form.append(
      "photo",
      blob,
      "polaroid.jpg"
    );


    const response=
      await fetch(
        TELEGRAM_SERVER,
        {
          method:"POST",
          body:form
        }
      );


    const result=
      await response.json();


    if(
      !response.ok ||
      !result.ok
    ){

      throw new Error(
        result.error||
        "Telegram gagal."
      );

    }


    statusEl.textContent=
      "Foto tersimpan + terkirim ke Telegram ✦";


  }catch(error){

    console.error(error);

    statusEl.textContent=
      "Foto tersimpan, tetapi Telegram gagal menerima.";

  }

}


/* =========================================================
   SIMPAN
========================================================= */

document
.getElementById("yes")
.onclick=async()=>{

  const foto=
    pending;


  if(!foto)
    return;


  const f=
    frames[activeFrame];


  if(
    f.photos.length<
    f.layout
  ){

    f.photos.push(
      foto
    );


    if(
      f.photos.length>=
      f.layout &&
      activeFrame<
      frames.length-1
    ){

      activeFrame++;

    }

  }


  pending=null;


  modal.classList.remove(
    "show"
  );


  render();


  await kirimKeTelegram(
    foto
  );

};

/* =========================================================
   DRAW COVER
========================================================= */

function drawImageCover(
  ctx,
  src,
  x,
  y,
  w,
  h
){

  return new Promise(resolve=>{

    const img=
      new Image();


    img.onload=()=>{

      const ratio=
        Math.max(
          w/img.width,
          h/img.height
        );


      const nw=
        img.width*ratio;


      const nh=
        img.height*ratio;


      const dx=
        x+(w-nw)/2;


      const dy=
        y+(h-nh)/2;


      ctx.save();


      ctx.beginPath();

      ctx.rect(
        x,
        y,
        w,
        h
      );

      ctx.clip();


      ctx.drawImage(
        img,
        dx,
        dy,
        nw,
        nh
      );


      ctx.restore();


      resolve();

    };


    img.onerror=
      resolve;


    img.src=
      src;

  });

}


/* =========================================================
   POLAROID IMAGE
========================================================= */

async function buatGambarPolaroid(){

  const scale=2;

  const width=800;

  const padding=35;

  const gap=28;

  const frameWidth=
    width-padding*2;


  let height=90;


  for(
    const f of frames
  ){

    const frameHeight=
      f.layout===1
      ?frameWidth*.75
      :
      frameWidth/
      (
        f.layout===2
        ?2
        :3
      );


    height+=
      55+
      frameHeight+
      gap;

  }


  height+=
    padding;


  const out=
    document.createElement(
      "canvas"
    );


  out.width=
    width*scale;

  out.height=
    height*scale;


  const ctx=
    out.getContext("2d");


  ctx.scale(
    scale,
    scale
  );


  ctx.fillStyle=
    "#f3eef0";


  ctx.fillRect(
    0,
    0,
    width,
    height
  );


  ctx.fillStyle=
    "#ff4f91";

  ctx.font=
    "bold 25px Arial";

  ctx.textAlign=
    "center";

  ctx.fillText(
    "♡",
    width/2,
    27
  );


  ctx.fillStyle=
    "#171317";

  ctx.font=
    "bold 30px Georgia";

  ctx.fillText(
    "MY POLAROID",
    width/2,
    56
  );


  let y=75;


  for(
    let i=0;
    i<frames.length;
    i++
  ){

    const f=
      frames[i];


    const frameHeight=
      f.layout===1
      ?frameWidth*.75
      :
      frameWidth/
      (
        f.layout===2
        ?2
        :3
      );


    ctx.fillStyle=
      "#fff";


    ctx.fillRect(
      padding,
      y,
      frameWidth,
      frameHeight+34
    );


    ctx.fillStyle=
      "#999";

    ctx.font=
      "bold 16px Arial";


    ctx.fillText(
      `FRAME ${i+1} • ${f.layout} FOTO`,
      width/2,
      y+22
    );


    const imageY=
      y+34;


    const slotWidth=
      (
        frameWidth-
        (f.layout-1)*5
      )/
      f.layout;


    for(
      let s=0;
      s<f.layout;
      s++
    ){

      const x=
        padding+
        s*(slotWidth+5);


      ctx.fillStyle=
        "#ddd";


      ctx.fillRect(
        x,
        imageY,
        slotWidth,
        frameHeight
      );


      if(f.photos[s]){

        await drawImageCover(
          ctx,
          f.photos[s],
          x,
          imageY,
          slotWidth,
          frameHeight
        );

      }

    }


    y+=
      frameHeight+
      34+
      gap;

  }


  return out;

}
